<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#0a001a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd966" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffd966" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)"/>
  
  <!-- Glow -->
  <circle cx="128" cy="128" r="80" fill="url(#glow)"/>
  
  <!-- Stars -->
  <circle cx="60" cy="50" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="200" cy="70" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="45" cy="180" r="1.2" fill="#ffffff" opacity="0.5"/>
  <circle cx="210" cy="190" r="0.8" fill="#ffffff" opacity="0.3"/>
  <circle cx="100" cy="40" r="0.8" fill="#ffffff" opacity="0.4"/>
  <circle cx="170" cy="210" r="1.2" fill="#ffffff" opacity="0.5"/>
  
  <!-- Petal (teardrop shape) -->
  <path d="M128,60 
           C128,60 118,90 112,110 
           C106,130 105,148 115,160 
           C125,172 140,172 148,160 
           C156,148 152,130 146,110 
           C140,90 128,60 128,60Z" 
        fill="#ffcc66" opacity="0.9"/>
  <path d="M128,65 
           C128,65 120,92 115,112 
           C110,132 110,148 118,158 
           C125,168 135,168 140,158 
           C146,148 144,132 140,112 
           C135,92 128,65 128,65Z" 
        fill="#ffdd88" opacity="0.5"/>
  
  <!-- Flower decoration -->
  <g transform="translate(128, 128)" opacity="0.3">
    <circle cx="0" cy="-25" r="4" fill="#ff99cc"/>
    <circle cx="20" cy="-15" r="4" fill="#ffcc66"/>
    <circle cx="20" cy="10" r="4" fill="#99ffcc"/>
    <circle cx="-20" cy="-15" r="4" fill="#ff9966"/>
    <circle cx="-20" cy="10" r="4" fill="#66ccff"/>
  </g>
</svg>
