name: Build Petal Drift APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  EXPORT_NAME: "petal-drift"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null 2>&1

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
          include-templates: true
          cache: true

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null

      - name: Export PCK file
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p build
          xvfb-run godot \
            --display-driver x11 \
            --rendering-driver opengl3 \
            --export-pack "Android" "build/${EXPORT_NAME}.pck"
          echo "PCK exported:"
          ls -la build/*.pck 2>/dev/null || echo "PCK NOT FOUND"

      - name: Build APK manually
        run: |
          cd "$GITHUB_WORKSPACE/build"
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          
          # Copy the template APK
          cp "$TEMPLATES_DIR/android_debug.apk" "${EXPORT_NAME}.apk"
          
          # Remove old PCK if present, then add ours with correct path
          zip -d "${EXPORT_NAME}.apk" "assets/data.pck" 2>/dev/null || true
          
          # Prepare the PCK with correct internal path
          mkdir -p /tmp/pck_staging/assets
          cp "${EXPORT_NAME}.pck" /tmp/pck_staging/assets/data.pck
          
          # Add to APK
          cd /tmp/pck_staging
          zip -r "$GITHUB_WORKSPACE/build/${EXPORT_NAME}.apk" assets/
          cd "$GITHUB_WORKSPACE/build"
          
          # Re-align APK (zipalign) then sign
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -f 4 "${EXPORT_NAME}.apk" "${EXPORT_NAME}-aligned.apk"
          mv "${EXPORT_NAME}-aligned.apk" "${EXPORT_NAME}.apk"
          
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            "${EXPORT_NAME}.apk"
          
          echo "APK built successfully:"
          ls -la "${EXPORT_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: petal-drift-android
          path: build/petal-drift.apk
          if-no-files-found: error
          retention-days: 30
