name: Build Petal Drift APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - uses: actions/checkout@v4

      # Install Android SDK components required by Godot
      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313" > /dev/null 2>&1 || true

      # Create debug keystore (required for unsigned APK)
      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=,OU=,O=,L=,S=,C="

      # Export the APK
      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/petal-drift.apk

      # Upload the APK as artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: petal-drift-android
          path: build/petal-drift.apk
          if-no-files-found: error
          retention-days: 30
