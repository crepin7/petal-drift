name: Build Petal Drift APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "petal-drift"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Godot installation
        run: |
          godot --version
          which godot

      - name: Setup Java
        run: |
          apt-get update -qq && apt-get install -y -qq openjdk-17-jdk-headless > /dev/null 2>&1
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Setup Android SDK
        run: |
          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          # Install required components
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313" > /dev/null 2>&1 || true

      - name: Install Android export templates
        run: |
          # Download and extract Android export templates
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATES_DIR"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -O /tmp/templates.tpz
          cd "$TEMPLATES_DIR" && unzip -qo /tmp/templates.tpz && mv templates/* . && rm -rf templates

      - name: Create debug keystore
        run: |
          KEYSTORE_DIR="$HOME/.android"
          mkdir -p "$KEYSTORE_DIR"
          keytool -genkey -v -keystore "$KEYSTORE_DIR/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null

      - name: Configure Godot Android settings
        run: |
          # Create editor settings with Android SDK/NDK paths
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" << 'EOSETTINGS'
          [editor_settings]
          version=4
          [android]
          adb = "/opt/android-sdk/platform-tools/adb"
          javac = "/usr/lib/jvm/java-17-openjdk-amd64/bin/javac"
          jdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          sdk_path = "/opt/android-sdk"
          debug_keystore = "/root/.android/debug.keystore"
          debug_keystore_password = "android"
          debug_keystore_alias = "androiddebugkey"
          force_system_user = true
          EOSETTINGS

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" "build/${EXPORT_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: petal-drift-android
          path: build/petal-drift.apk
          if-no-files-found: error
          retention-days: 30
