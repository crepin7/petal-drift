name: Build Petal Drift APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  EXPORT_NAME: "petal-drift"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot 4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
          include-templates: true
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK extras
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          yes | $SDKMANAGER \
            "platforms;android-34" \
            "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null

      - name: Install xvfb for virtual display
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null 2>&1

      - name: Initialize editor settings (virtual display)
        run: |
          # First run with virtual display to create editor settings
          xvfb-run godot --editor --quit 2>&1 || true
          echo "--- Check for editor settings ---"
          find "$HOME/.config/godot" -name "editor*" -o -name "Editor*" 2>/dev/null
          find "$HOME/.local/share/godot" -name "editor*" -o -name "Editor*" 2>/dev/null
          # Also check what templates are found
          ls -la "$HOME/.local/share/godot/export_templates/" 2>/dev/null

      - name: Export APK
        run: |
          mkdir -p build
          xvfb-run godot --export-debug "Android" "build/${EXPORT_NAME}.apk"
        env:
          ANDROID_HOME: "${{ env.ANDROID_HOME }}"
          JAVA_HOME: "${{ env.JAVA_HOME }}"
          DISPLAY: ":99"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: petal-drift-android
          path: build/petal-drift.apk
          if-no-files-found: error
          retention-days: 30
