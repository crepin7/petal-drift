name: Build Petal Drift APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  EXPORT_NAME: "petal-drift"
  PACKAGE_NAME: "com.nousresearch.petaldrift"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1

      - name: Install xvfb
        run: sudo apt-get update -qq && sudo -S -p '' apt-get install -y -qq xvfb > /dev/null 2>&1

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
          include-templates: true
          cache: true

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null

      - name: Export PCK
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          mkdir -p build
          xvfb-run godot \
            --display-driver x11 \
            --rendering-driver opengl3 \
            --export-pack "Android" "build/${EXPORT_NAME}.pck"
          PCK_SIZE=$(stat -c%s "build/${EXPORT_NAME}.pck" 2>/dev/null || echo "0")
          echo "PCK size: ${PCK_SIZE} bytes"
          if [ "$PCK_SIZE" -lt 1000 ]; then
            echo "ERROR: PCK too small (${PCK_SIZE} bytes)"
            exit 1
          fi
          exit 0

      - name: Build APK with Gradle
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"

          # Extract Android Gradle project
          unzip -o -q "$TEMPLATES_DIR/android_source.zip" -d "$GITHUB_WORKSPACE"

          # Copy PCK into assets
          mkdir -p "$GITHUB_WORKSPACE/assets"
          cp "build/${EXPORT_NAME}.pck" "$GITHUB_WORKSPACE/assets/data.pck"

          # Add project config to gradle.properties
          echo "" >> gradle.properties
          echo "# Petal Drift Android configuration" >> gradle.properties
          echo "exportEnabled=true" >> gradle.properties
          echo "package_name=${PACKAGE_NAME}" >> gradle.properties
          echo "version_code=1" >> gradle.properties
          echo "version_name=1.0" >> gradle.properties
          echo "perform_signing=true" >> gradle.properties
          echo "keystore=${HOME}/.android/debug.keystore" >> gradle.properties
          echo "keystore_user=androiddebugkey" >> gradle.properties
          echo "keystore_password=android" >> gradle.properties

          echo "=== gradle.properties ==="
          cat gradle.properties

          # Build debug APK
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -30
          GRADLE_EXIT=$?

          echo "Gradle exit code: $GRADLE_EXIT"

          # Copy output
          APK_OUT=$(find . -path "*/outputs/apk/debug/*.apk" -type f | head -1)
          if [ -z "$APK_OUT" ]; then
            echo "ERROR: No APK found in build outputs"
            find . -name "*.apk" -type f 2>/dev/null || true
            find . -path "*/outputs/*" -type f 2>/dev/null | head -20
            exit 1
          fi

          mkdir -p build
          cp "$APK_OUT" "build/${EXPORT_NAME}.apk"
          echo "=== APK built ==="
          ls -la "build/${EXPORT_NAME}.apk"

          # Verify with aapt
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          if [ -f "$AAPT" ]; then
            echo "=== APK package info ==="
            "$AAPT" dump badging "build/${EXPORT_NAME}.apk" 2>/dev/null | grep -E "package:|application-label:|launchable-activity:" | head -5
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: petal-drift-android
          path: build/petal-drift.apk
          if-no-files-found: error
          retention-days: 30
