name: Build Petal Drift APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  EXPORT_NAME: "petal-drift"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null 2>&1

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
          include-templates: true
          cache: true

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null

      - name: Export PCK file
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p build
          # Use headless mode to export just the PCK
          xvfb-run godot \
            --display-driver x11 \
            --rendering-driver opengl3 \
            --export-pack "Android" "build/${EXPORT_NAME}.pck"
          echo "PCK exported:"
          ls -la build/*.pck 2>/dev/null || echo "PCK NOT FOUND"

      - name: Build APK manually
        run: |
          cd "$GITHUB_WORKSPACE/build"
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          
          # Copy the template APK
          cp "$TEMPLATES_DIR/android_debug.apk" "${EXPORT_NAME}.apk"
          
          # Add PCK to APK (replace existing data.pck if any, or add new)
          if zipinfo "${EXPORT_NAME}.apk" "assets/data.pck" > /dev/null 2>&1; then
            echo "Replacing existing data.pck in APK..."
            zip -j "${EXPORT_NAME}.apk" "${EXPORT_NAME}.pck" --out temp.apk
            # Remove old entry and add with correct name
            zip -d temp.apk "assets/data.pck"
            zip -j temp.apk "${EXPORT_NAME}.pck" --rename "assets/data.pck"
            mv temp.apk "${EXPORT_NAME}.apk"
          else
            echo "Adding new data.pck to APK..."
            zip -j "${EXPORT_NAME}.apk" "${EXPORT_NAME}.pck" --rename "assets/data.pck"
          fi
          
          # Sign the APK with debug keystore
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            "${EXPORT_NAME}.apk"
          
          echo "APK built successfully:"
          ls -la "${EXPORT_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: petal-drift-android
          path: build/petal-drift.apk
          if-no-files-found: error
          retention-days: 30
