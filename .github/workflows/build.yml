name: Build Petal Drift APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  EXPORT_NAME: "petal-drift"
  GODOT_VERSION: "4.3"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null 2>&1

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
          include-templates: true
          cache: true

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null

      - name: Install Android build template
        run: |
          cd "$GITHUB_WORKSPACE"
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          echo "=== Extracting android_source.zip ==="
          unzip -o -q "$TEMPLATES_DIR/android_source.zip" -d "$GITHUB_WORKSPACE"
          echo "=== Template installed ==="
          ls -la "$GITHUB_WORKSPACE/android/" 2>/dev/null || echo "No android/ directory"
          # Godot checks for the android/ directory to confirm template is installed

      - name: Import resources & Export APK
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p build

          echo "=== Importing resources ==="
          xvfb-run godot --display-driver x11 --rendering-driver opengl3 --import 2>&1 | tail -5 || true

          echo "=== Exporting debug APK ==="
          xvfb-run godot \
            --display-driver x11 \
            --rendering-driver opengl3 \
            --export-debug "Android" "build/${EXPORT_NAME}.apk" 2>&1

          APK_SIZE=$(stat -c%s "build/${EXPORT_NAME}.apk" 2>/dev/null || echo "0")
          echo "APK size: ${APK_SIZE} bytes"

          if [ "$APK_SIZE" -lt 10000 ]; then
            echo "ERROR: APK too small or export failed"
            exit 1
          fi

          echo "=== APK built successfully ==="
          ls -la "build/${EXPORT_NAME}.apk"

      - name: Verify APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          "$BUILD_TOOLS/aapt" dump badging "build/${EXPORT_NAME}.apk" 2>/dev/null | grep -E "package:|application-label:|launchable-activity:" | head -5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: petal-drift-android
          path: build/petal-drift.apk
          if-no-files-found: error
          retention-days: 30
