name: Build Petal Drift APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  EXPORT_NAME: "petal-drift"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot 4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
          include-templates: true
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK extras
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | $SDK --licenses > /dev/null 2>&1 || true
          yes | $SDK "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null

      - name: Write editor settings script
        run: |
          cat > /tmp/write_settings.py << 'PYEOF'
          import os
          home = os.environ['HOME']
          jhome = os.environ.get('JAVA_HOME', '')
          ahome = os.environ.get('ANDROID_HOME', '')
          content = f"""[gd_resource type="EditorSettings" load_steps=2 format=3]

          [resource]
          version = 4
          rendering/quality/driver/driver_name = "opengl3"
          android/java_sdk_path = "{jhome}"
          android/android_sdk_path = "{ahome}"
          android/debug_keystore = "{home}/.android/debug.keystore"
          android/debug_keystore_pass = "android"
          android/debug_keystore_alias = "androiddebugkey"
          android/force_system_user = true
          """
          settings_dir = os.path.join(home, '.config', 'godot')
          os.makedirs(settings_dir, exist_ok=True)
          path = os.path.join(settings_dir, 'editor_settings-4.3.tres')
          with open(path, 'w') as f:
              f.write(content)
          print('Created:', path)
          PYEOF

      - name: Configure Godot editor settings
        run: python3 /tmp/write_settings.py
        env:
          JAVA_HOME: "${{ env.JAVA_HOME }}"
          ANDROID_HOME: "${{ env.ANDROID_HOME }}"

      - name: Verify export templates
        run: |
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          echo "Templates dir: $TEMPLATES_DIR"
          ls -la "$TEMPLATES_DIR/" 2>/dev/null || echo "Not found!"
          find "$HOME/.local/share/godot" -name "android_source*" 2>/dev/null

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --rendering-driver opengl3 \
            --export-debug "Android" "build/${EXPORT_NAME}.apk"
        env:
          ANDROID_HOME: "${{ env.ANDROID_HOME }}"
          JAVA_HOME: "${{ env.JAVA_HOME }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: petal-drift-android
          path: build/petal-drift.apk
          if-no-files-found: error
          retention-days: 30
