name: Build Petal Drift APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    name: Build Android APK

    steps:
      - uses: actions/checkout@v4

      # Use the godot-ci action that handles all the Android SDK + templates setup
      - name: Build with Godot CI
        uses: abarichello/godot-ci@v4
        with:
          version: 4.3
          export_preset: Android
          export_path: build/petal-drift.apk

      # Upload the APK as artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: petal-drift-android
          path: build/petal-drift.apk
          if-no-files-found: error
          retention-days: 30
