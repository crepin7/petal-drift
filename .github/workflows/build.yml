name: Build Petal Drift APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  EXPORT_NAME: "petal-drift"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null 2>&1

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
          include-templates: true
          cache: true

      - name: Create editor settings
        run: |
          EDITOR_DIR="$HOME/.config/godot/editor"
          mkdir -p "$EDITOR_DIR"
          cat > "$EDITOR_DIR/editor_settings-4.3.tres" << 'EDITOR_SETTINGS'
          [gd_resource type="EditorSettings"]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/temurin-17-jdk-amd64"
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EDITOR_SETTINGS

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null

      - name: Export PCK file
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p build
          xvfb-run godot \
            --display-driver x11 \
            --rendering-driver opengl3 \
            --export-pack "Android" "build/${EXPORT_NAME}.pck"
          echo "=== PCK exported ==="
          ls -la build/*.pck
          # Verify PCK has content
          PCK_SIZE=$(stat -c%s "build/${EXPORT_NAME}.pck")
          if [ "$PCK_SIZE" -lt 1000 ]; then
            echo "ERROR: PCK file too small ($PCK_SIZE bytes), export likely failed"
            exit 1
          fi

      - name: Build APK with Gradle
        run: |
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          
          # Extract Android Gradle project from template
          unzip -o -q "$TEMPLATES_DIR/android_source.zip" -d "$GITHUB_WORKSPACE"
          
          # Copy PCK into the Gradle project's assets
          mkdir -p "$GITHUB_WORKSPACE/assets"
          cp "build/${EXPORT_NAME}.pck" "$GITHUB_WORKSPACE/assets/data.pck"
          
          echo "=== Gradle project structure ==="
          ls "$GITHUB_WORKSPACE/build.gradle" "$GITHUB_WORKSPACE/AndroidManifest.xml" 2>&1
          ls "$GITHUB_WORKSPACE/assets/data.pck" 2>&1
          
          # Build debug APK with Gradle
          chmod +x gradlew
          ./gradlew assembleDebug \
            -Pexport_name="${EXPORT_NAME}" \
            -Psigning_debug=true \
            -Pkeystore_user=androiddebugkey \
            -Pkeystore_password=android \
            --no-daemon
          
          echo "=== Build output ==="
          find . -name "*.apk" -type f 2>/dev/null
          
          # Find and copy the output APK
          APK_PATH=$(find . -path "*/outputs/apk/debug/*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found in build outputs"
            exit 1
          fi
          
          mkdir -p build
          cp "$APK_PATH" "build/${EXPORT_NAME}.apk"
          echo "APK built: build/${EXPORT_NAME}.apk ($(stat -c%s "build/${EXPORT_NAME}.apk") bytes)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: petal-drift-android
          path: build/petal-drift.apk
          if-no-files-found: error
          retention-days: 30
