name: Build Petal Drift APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  EXPORT_NAME: "petal-drift"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
          include-templates: true
          cache: true

      - name: Install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null 2>&1

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null

      - name: Initialize Godot editor (create settings)
        run: |
          cd "$GITHUB_WORKSPACE"
          xvfb-run godot --display-driver x11 --rendering-driver opengl3 --editor --quit 2>/dev/null || true
          echo "Editor settings:"
          find "$HOME/.config/godot" -name "editor*" 2>/dev/null

      - name: Export APK
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p build
          xvfb-run godot \
            --display-driver x11 \
            --rendering-driver opengl3 \
            --export-debug "Android" "build/${EXPORT_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: petal-drift-android
          path: build/petal-drift.apk
          if-no-files-found: error
          retention-days: 30
